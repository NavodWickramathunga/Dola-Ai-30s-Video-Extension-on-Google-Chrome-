<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Joining your Dola video</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-width: 560px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 20px; margin-bottom: 6px; }
    canvas { width: 100%; max-height: 60vh; object-fit: contain; background: #000; border-radius: 12px; display: block; margin-top: 12px; }
    .bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 14px 0 8px; }
    .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s linear; }
    video { display: none; }
  </style>
</head>
<body>
  <h1>Joining your clips into one video</h1>
  <p class="muted">Keep this tab open. The clips are played back to back and recorded into one file, so this takes about as long as the video itself.</p>
  <div class="bar"><div id="bar"></div></div>
  <p id="status">Loading clips…</p>
  <button id="start" class="primary" hidden>Start joining</button>
  <canvas id="canvas"></canvas>
  <video id="player" playsinline></video>
  <script src="join.js"></script>
</body>
</html>
