<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stitching your Dola video</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-width: 720px; margin: 32px auto; padding: 0 16px; }
    canvas { width: 100%; max-height: 60vh; object-fit: contain; background: #000; border-radius: 12px; display: block; }
    .bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 12px 0; }
    .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
    video { display: none; }
  </style>
</head>
<body>
  <h1>Stitching your video</h1>
  <p class="muted">Keep this tab open and visible — clips are played back in real time and recorded into one file (about as long as the video itself).</p>
  <div class="bar"><div id="bar"></div></div>
  <p id="status">Loading clips…</p>
  <button id="start" class="primary" hidden>Start stitching</button>
  <canvas id="canvas"></canvas>
  <video id="player" playsinline></video>
  <script src="merge.js"></script>
</body>
</html>
